version: 2
updates:
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: daily

  - package-ecosystem: composer
    directory: /server
    schedule:
      interval: weekly
    # Groupes séparés : seules les PR de correctifs sont fusionnées automatiquement.
    groups:
      composer-patch:
        update-types: [patch]
      composer-minor:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
