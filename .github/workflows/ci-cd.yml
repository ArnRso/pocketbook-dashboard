name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: arnrso/pocketbook-dashboard

permissions:
  contents: read

# Un nouveau push annule le pipeline encore en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Static Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: imagick, intl, pdo_sqlite, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      # PHPStan lit le conteneur compilé pour comprendre les services Symfony.
      - name: Warm dev cache (for PHPStan)
        run: php bin/console cache:warmup --env=dev

      # Bibliothèques JavaScript de l'admin (éditeur de grille), nécessaires aux tests fonctionnels
      - name: Install importmap assets
        run: php bin/console importmap:install

      # Même commande qu'en local : ce qui passe sur ton poste passe ici.
      - name: Run quality checks and tests
        run: composer qa

  # L'image de production est construite à chaque pull request pour détecter au plus tôt
  # ce qui ne casse qu'en prod (dépendance de dev manquante, cache:warmup…), et publiée sur main.
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: server
          target: runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  device:
    name: Device App (lint, tests & cross-compilation)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: device

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Chaîne de compilation PocketBook (SDK officiel), identique à celle utilisée en local.
      - name: Build SDK toolchain image
        run: docker build --platform linux/amd64 -t pocketbook-dashboard-sdk .

      # Même commande qu'en local (make docker-qa), avec AddressSanitizer : la CI tourne en x86 natif.
      # Lancée sous l'utilisateur du runner pour que les étapes suivantes puissent écrire dans dist/.
      - name: Run quality checks, tests and cross-compilation
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src pocketbook-dashboard-sdk make qa VERSION="${GITHUB_SHA::7}"

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: pocketbook-dashboard-app
          path: device/dist/pocketbook-dashboard.app
          if-no-files-found: error

      # La dernière version de main est publiée dans la release « device-latest » :
      # - pocketbook-dashboard + version.txt (version et SHA-256) pour la mise à jour automatique des liseuses ;
      # - pocketbook-dashboard.zip pour une installation manuelle (GitHub refuse l'extension .app).
      - name: Publish application
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/pocketbook-dashboard.app dist/pocketbook-dashboard
          printf '%s\n%s\n' "${GITHUB_SHA::7}" "$(sha256sum dist/pocketbook-dashboard | cut -d' ' -f1)" > dist/version.txt
          (cd dist && zip -q pocketbook-dashboard.zip pocketbook-dashboard.app)
          gh release view device-latest > /dev/null 2>&1 \
            || gh release create device-latest --prerelease --title "Application liseuse" --notes "Dernière version de main."
          # Une liseuse qui lirait version.txt pendant la publication obtiendrait une empreinte qui ne correspond pas
          # au binaire téléchargé : elle refuserait la mise à jour et réessaierait plus tard.
          gh release upload device-latest dist/pocketbook-dashboard dist/pocketbook-dashboard.zip --clobber
          gh release upload device-latest dist/version.txt --clobber
          gh release edit device-latest --notes "Dernière version de main : ${GITHUB_SHA::7}. Les liseuses se mettent à jour automatiquement ; pour une installation manuelle, décompresser pocketbook-dashboard.zip et copier pocketbook-dashboard.app dans le dossier applications."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
