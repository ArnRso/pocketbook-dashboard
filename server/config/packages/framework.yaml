# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            open_meteo.client:
                base_uri: 'https://api.open-meteo.com'
                timeout: 20
            # Waze répond sur plusieurs sous-domaines (géocodage et calcul d'itinéraire)
            waze.client:
                scope: 'https://[a-z0-9-]+\.waze\.com'
                timeout: 30
                headers:
                    Referer: 'https://www.waze.com/'
            # Données ouvertes de Bordeaux Métropole (fermetures du pont Chaban-Delmas)
            bordeaux_metropole.client:
                base_uri: 'https://opendata.bordeaux-metropole.fr'
                timeout: 20
            # API SIRI-Lite du réseau TBM (passages en temps réel)
            tbm.client:
                base_uri: 'https://bdx.mecatran.com'
                timeout: 20
                headers:
                    Accept: 'application/json'

when@prod:
    framework:
        # Derrière le tunnel Pangolin, le conteneur reçoit du HTTP simple : sans confiance
        # dans X-Forwarded-Proto, Symfony génère des URLs http:// (lien de la clé d'accès, redirections).
        trusted_proxies: '%env(TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port', 'x-forwarded-prefix']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
