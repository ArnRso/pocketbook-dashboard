framework:
    cache:
        pools:
            cache.weather:
                adapter: cache.app
                default_lifetime: 900
            cache.traffic:
                adapter: cache.app
                default_lifetime: 300
            # Les prévisions de fermeture du pont changent rarement
            cache.bridge:
                adapter: cache.app
                default_lifetime: 3600
            # Passages TBM : une requête par arrêt et par minute au plus
            cache.transit:
                adapter: cache.app
                default_lifetime: 60
            # Lignes et arrêts du réseau TBM
            cache.transit_network:
                adapter: cache.app
                default_lifetime: 86400

when@test:
    framework:
        cache:
            app: cache.adapter.array
