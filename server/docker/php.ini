date.timezone = ${TZ}
memory_limit = 256M
expose_php = Off

; php2shell (CVE-2026-109619) : chemins d'exploitation confirmés, à garder coupés même sur une version corrigée.
; L'appli n'utilise ni la progression d'upload en session ni les backtraces des erreurs fatales.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
