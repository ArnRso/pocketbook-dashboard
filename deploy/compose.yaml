# Stack de production, à déployer sur le serveur. Watchtower met à jour les conteneurs
# portant le label com.centurylinklabs.watchtower.enable dès qu'une nouvelle image est publiée.
services:
  app:
    image: arnrso/pocketbook-dashboard:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      APP_SECRET: ${APP_SECRET:?Définir APP_SECRET dans le fichier .env à côté de ce compose.yaml}
      GOTENBERG_DSN: http://gotenberg:3000
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - app_data:/data
    depends_on:
      - gotenberg
    labels:
      - com.centurylinklabs.watchtower.enable=true

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  app_data:
